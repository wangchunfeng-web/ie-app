<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>智慧山積圖 Yamazumi Pro</title>

<!-- PWA -->
<link rel="manifest" href="data:application/json,{&quot;name&quot;:&quot;Yamazumi Pro&quot;,&quot;short_name&quot;:&quot;Yamazumi&quot;,&quot;display&quot;:&quot;standalone&quot;,&quot;background_color&quot;:&quot;#0f172a&quot;,&quot;theme_color&quot;:&quot;#0f172a&quot;}" />
<meta name="theme-color" content="#0f172a" />
<meta name="apple-mobile-web-app-capable" content="yes" />

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<style>
body { -webkit-tap-highlight-color: transparent; }
</style>
</head>
<body class="bg-slate-100 text-slate-800">

<header class="bg-slate-900 text-white p-4 font-bold text-lg">
  智慧山積圖 Yamazumi Pro
</header>

<main class="p-4 space-y-4">

<!-- 基本設定 -->
<div class="bg-white p-4 rounded shadow">
  <div class="grid grid-cols-2 gap-3">
    <div>
      <label class="text-sm">目標節拍 (秒)</label>
      <input id="takt" type="number" class="w-full border p-2 rounded" />
    </div>
    <div>
      <label class="text-sm">人數</label>
      <input id="workers" type="number" class="w-full border p-2 rounded" />
    </div>
  </div>
</div>

<!-- 新增工序 -->
<div class="bg-white p-4 rounded shadow space-y-2">
  <h2 class="font-bold">新增工序</h2>
  <input id="taskName" placeholder="工序名稱" class="w-full border p-2 rounded" />
  <input id="taskTime" type="number" placeholder="工時(秒)" class="w-full border p-2 rounded" />
  <select id="taskLine" class="w-full border p-2 rounded">
    <option value="A">線別 A</option>
    <option value="B">線別 B</option>
  </select>
  <button onclick="addTask()" class="w-full bg-blue-600 text-white p-2 rounded">新增</button>
</div>

<!-- 圖表 -->
<div class="bg-white p-4 rounded shadow">
  <canvas id="chart" height="260"></canvas>
</div>

<!-- 操作 -->
<div class="grid grid-cols-2 gap-2">
  <button onclick="exportExcel()" class="bg-emerald-600 text-white p-2 rounded">匯出 Excel</button>
  <button onclick="resetAll()" class="bg-red-600 text-white p-2 rounded">清空資料</button>
</div>

</main>

<script>
/* === State === */
const KEY = 'yamazumi_pro';
let state = JSON.parse(localStorage.getItem(KEY)) || {
  takt: 180,
  workers: 2,
  tasks: []
};

/* === Init === */
takt.value = state.takt;
workers.value = state.workers;

[takt, workers].forEach(el => el.onchange = save);

function save() {
  state.takt = Number(takt.value);
  state.workers = Number(workers.value);
  localStorage.setItem(KEY, JSON.stringify(state));
  render();
}

function addTask() {
  if (!taskName.value || !taskTime.value) return;
  state.tasks.push({
    id: Date.now(),
    name: taskName.value,
    time: Number(taskTime.value),
    line: taskLine.value
  });
  taskName.value = taskTime.value = '';
  save();
}

function resetAll() {
  if (!confirm('確定清空？')) return;
  localStorage.removeItem(KEY);
  location.reload();
}

/* === Yamazumi Algorithm === */
function calculateStacks() {
  const stacks = Array.from({ length: state.workers }, () => 0);
  state.tasks.forEach(t => {
    let i = stacks.indexOf(Math.min(...stacks));
    stacks[i] += t.time;
  });
  return stacks;
}

/* === Chart === */
let chart;
function render() {
  const stacks = calculateStacks();
  if (chart) chart.destroy();
  chart = new Chart(document.getElementById('chart'), {
    type: 'bar',
    data: {
      labels: stacks.map((_, i) => `人員 ${i+1}`),
      datasets: [{
        label: '累計工時',
        data: stacks,
        backgroundColor: stacks.map(v => v > state.takt ? '#ef4444' : '#3b82f6')
      }]
    },
    options: { scales: { y: { beginAtZero: true } } }
  });
}

/* === Excel === */
function exportExcel() {
  const ws = XLSX.utils.json_to_sheet(state.tasks);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Tasks');
  XLSX.writeFile(wb, 'yamazumi.xlsx');
}

render();

/* === PWA Offline === */
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register(URL.createObjectURL(new Blob([
    `self.addEventListener('fetch',e=>e.respondWith(caches.open('v1').then(c=>c.match(e.request).then(r=>r||fetch(e.request).then(res=>{c.put(e.request,res.clone());return res;})))))`
  ], { type: 'text/javascript' })));
}
</script>
</body>
</html>
