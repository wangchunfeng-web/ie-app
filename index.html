<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>工廠製程管理系統</title>
<style>
  body { font-family: Arial, sans-serif; margin:0; padding:0; background:#f4f4f4; }
  header { background:#007bff; color:white; padding:10px; text-align:center; }
  h1 { margin:0; font-size:1.2em; }
  #controls { display:flex; flex-wrap:wrap; padding:10px; gap:10px; background:#fff; }
  #controls select, #controls input { padding:5px; }
  #process-container { display:flex; flex-wrap:wrap; gap:10px; padding:10px; }
  .process-line { background:#fff; padding:10px; border-radius:8px; flex:1; min-width:250px; }
  .process-line h2 { font-size:1em; margin-top:0; }
  .task { padding:8px; margin:5px 0; background:#eee; border-radius:5px; cursor:grab; display:flex; justify-content:space-between; align-items:center; }
  .task.dragging { opacity:0.5; }
  .chart { width:100%; height:150px; margin-top:10px; }
  button { padding:5px 10px; cursor:pointer; border:none; border-radius:5px; background:#007bff; color:white; }
</style>
</head>
<body>
<header>
  <h1>工廠製程管理系統</h1>
</header>

<div id="controls">
  <button onclick="exportExcel()">📄 匯出 Excel</button>
  <button onclick="addLine()">➕ 新增製程段</button>
</div>

<div id="process-container"></div>

<!-- Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<!-- SheetJS -->
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

<script>
let lines = [];
function addLine(name) {
  const lineName = name || `製程段 ${lines.length+1}`;
  const line = { name: lineName, tasks: [] };
  lines.push(line);
  renderLines();
}

function addTask(lineIndex, taskName) {
  const person = prompt("指派人員：");
  const standardTime = parseFloat(prompt("標準工時：")) || 1;
  const actualTime = parseFloat(prompt("實績工時：")) || standardTime;
  lines[lineIndex].tasks.push({name: taskName, person, standardTime, actualTime});
  renderLines();
}

function renderLines() {
  const container = document.getElementById("process-container");
  container.innerHTML = "";
  lines.forEach((line, idx) => {
    const div = document.createElement("div");
    div.className = "process-line";
    div.innerHTML = `<h2>${line.name} <button onclick="addTask(${idx}, '工序 ${line.tasks.length+1}')">➕ 工序</button></h2>`;
    line.tasks.forEach((task, tIdx) => {
      const taskDiv = document.createElement("div");
      taskDiv.className = "task";
      taskDiv.draggable = true;
      taskDiv.innerHTML = `<span>${task.name} (${task.person})</span><span>${task.actualTime}/${task.standardTime}h</span>`;
      taskDiv.addEventListener('dragstart', e => { e.dataTransfer.setData('text/plain', idx+","+tIdx); taskDiv.classList.add('dragging'); });
      taskDiv.addEventListener('dragend', e => { taskDiv.classList.remove('dragging'); });
      taskDiv.addEventListener('dragover', e => e.preventDefault());
      taskDiv.addEventListener('drop', e => {
        e.preventDefault();
        const data = e.dataTransfer.getData('text/plain').split(',');
        const fromLine = parseInt(data[0]), fromTask = parseInt(data[1]);
        const temp = lines[fromLine].tasks[fromTask];
        lines[fromLine].tasks.splice(fromTask,1);
        lines[idx].tasks.splice(tIdx,0,temp);
        renderLines();
      });
      div.appendChild(taskDiv);
    });
    // 繪製山積圖
    const canvas = document.createElement("canvas");
    canvas.className = "chart";
    div.appendChild(canvas);
    renderChart(canvas, line.tasks);
    container.appendChild(div);
  });
}

function renderChart(canvas, tasks) {
  const ctx = canvas.getContext('2d');
  const labels = tasks.map(t=>t.name);
  const standardData = tasks.map(t=>t.standardTime);
  const actualData = tasks.map(t=>t.actualTime);
  new Chart(ctx, {
    type:'bar',
    data:{
      labels,
      datasets:[
        {label:'標準工時', data:standardData, backgroundColor:'#007bff'},
        {label:'實績工時', data:actualData, backgroundColor:'#ff5733'}
      ]
    },
    options:{ responsive:true, maintainAspectRatio:false }
  });
}

function exportExcel() {
  let wb = XLSX.utils.book_new();
  lines.forEach(line => {
    const ws_data = [['工序','人員','標準工時','實績工時']];
    line.tasks.forEach(t => ws_data.push([t.name, t.person, t.standardTime, t.actualTime]));
    const ws = XLSX.utils.aoa_to_sheet(ws_data);
    XLSX.utils.book_append_sheet(wb, ws, line.name);
  });
  XLSX.writeFile(wb, "工廠製程.xlsx");
}

// 初始化
addLine("前段");
addLine("後段");
</script>

<!-- PWA Service Worker -->
<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(console.error);
}
</script>
</body>
</html>
