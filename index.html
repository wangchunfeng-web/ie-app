<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>智慧山積圖</title>

  <!-- PWA -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#0f172a" />
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/2921/2921226.png" />

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- React (Production) -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    body { background:#f1f5f9; }
  </style>
</head>

<body>
  <div id="root"></div>

  <script>
    const e = React.createElement;
    const { useState, useEffect, useRef } = React;

    function App() {
      const [count, setCount] = useState(0);
      const chartRef = useRef(null);
      const chartIns = useRef(null);

      useEffect(() => {
        if (!chartRef.current) return;
        if (chartIns.current) chartIns.current.destroy();

        chartIns.current = new Chart(chartRef.current, {
          type: 'bar',
          data: {
            labels: ['A工位', 'B工位', 'C工位'],
            datasets: [{
              label: '工時',
              data: [120, 180, 150],
              backgroundColor: '#3b82f6'
            }]
          },
          options: { responsive: true }
        });
      }, []);

      return e(
        'div',
        { className: 'min-h-screen p-4' },
        e('h1', { className: 'text-xl font-bold mb-4' }, '智慧山積圖（正式版）'),
        e(
          'button',
          {
            className: 'bg-blue-600 text-white px-4 py-2 rounded mb-4',
            onClick: () => setCount(count + 1)
          },
          '點擊次數：', count
        ),
        e(
          'div',
          { className: 'bg-white p-4 rounded shadow' },
          e('canvas', { ref: chartRef, height: 200 })
        )
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(e(App));
  </script>
</body>
</html>
