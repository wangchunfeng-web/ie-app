<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>智慧山積圖</title>

<!-- PWA -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f172a">

<link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/2921/2921226.png">

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body { -webkit-tap-highlight-color: transparent; }
.chart-box { height: 260px; }
</style>
</head>

<body class="bg-slate-100 text-slate-800 pb-24">

<nav class="bg-slate-900 text-white p-3 sticky top-0 z-50">
  <div class="flex justify-between items-center">
    <div class="font-bold">智慧山積圖</div>
    <button onclick="resetData()" class="text-sm bg-red-500 px-3 py-1 rounded">清空</button>
  </div>
</nav>

<main class="p-4 space-y-4">

<!-- 基本設定 -->
<div class="bg-white p-4 rounded shadow space-y-2">
  <div class="grid grid-cols-2 gap-2 text-sm">
    <div>
      <label>目標節拍(s)</label>
      <input id="takt" type="number" class="w-full border p-1 rounded" />
    </div>
    <div>
      <label>寬放率</label>
      <input id="allowance" type="number" step="0.01" class="w-full border p-1 rounded" />
    </div>
  </div>
</div>

<!-- 新增工序 -->
<div class="bg-white p-4 rounded shadow space-y-2">
  <h2 class="font-bold text-sm">新增工序</h2>
  <input id="taskName" placeholder="名稱" class="w-full border p-2 rounded text-sm">
  <input id="taskTime" type="number" placeholder="秒數" class="w-full border p-2 rounded text-sm">
  <button onclick="addTask()" class="w-full bg-blue-600 text-white p-2 rounded">新增</button>
</div>

<!-- Chart -->
<div class="bg-white p-4 rounded shadow">
  <div class="chart-box">
    <canvas id="chart"></canvas>
  </div>
</div>

<!-- 任務列表 -->
<div class="bg-white p-4 rounded shadow">
  <h2 class="font-bold text-sm mb-2">工序列表</h2>
  <div id="taskList" class="space-y-2"></div>
</div>

</main>

<script>
const storeKey = 'yamazumi_v1';

let state = JSON.parse(localStorage.getItem(storeKey)) || {
  takt: 180,
  allowance: 1.05,
  tasks: []
};

const taktInput = document.getElementById('takt');
const allowanceInput = document.getElementById('allowance');
const list = document.getElementById('taskList');

taktInput.value = state.takt;
allowanceInput.value = state.allowance;

taktInput.onchange = () => {
  state.takt = Number(taktInput.value);
  save();
};
allowanceInput.onchange = () => {
  state.allowance = Number(allowanceInput.value);
  save();
};

function save() {
  localStorage.setItem(storeKey, JSON.stringify(state));
  render();
}

function addTask() {
  const name = taskName.value.trim();
  const time = Number(taskTime.value);
  if (!name || !time) return;

  state.tasks.push({ id: Date.now(), name, time });
  taskName.value = '';
  taskTime.value = '';
  save();
}

function deleteTask(id) {
  state.tasks = state.tasks.filter(t => t.id !== id);
  save();
}

function resetData() {
  if (!confirm('確定清空？')) return;
  localStorage.removeItem(storeKey);
  location.reload();
}

let chart;
function renderChart() {
  const labels = state.tasks.map(t => t.name);
  const data = state.tasks.map(t => t.time);
  if (chart) chart.destroy();

  chart = new Chart(document.getElementById('chart'), {
    type: 'bar',
    data: {
      labels,
      datasets: [{
        label: '工時(s)',
        data,
        backgroundColor: data.map(v => v > state.takt ? '#ef4444' : '#3b82f6')
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      scales: { y: { beginAtZero: true } }
    }
  });
}

function renderList() {
  list.innerHTML = '';
  state.tasks.forEach(t => {
    const div = document.createElement('div');
    div.className = 'flex justify-between items-center border p-2 rounded text-sm';
    div.innerHTML = `
      <div>${t.name} (${t.time}s)</div>
      <button class="text-red-500" onclick="deleteTask(${t.id})">刪</button>
    `;
    list.appendChild(div);
  });
}

function render() {
  renderList();
  renderChart();
}

render();
</script>

</body>
</html>
