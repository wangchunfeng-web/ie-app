<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智慧裝配山積圖系統 (左側工時顯示版)</title>
    
    <!-- CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React 核心 -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        .chart-container { position: relative; width: 100%; height: 300px; max-height: 400px; }
        @media print { .no-print { display: none !important; } .print-only { display: block !important; } body { background: white; } }
        .lane-scroll::-webkit-scrollbar { width: 6px; }
        .lane-scroll::-webkit-scrollbar-track { background: #f1f5f9; }
        .lane-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        .lane-scroll::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        .analysis-table { border-collapse: collapse; width: 100%; font-size: 14px; text-align: center; }
        .analysis-table th, .analysis-table td { border: 1px solid #000; padding: 6px; }
        .analysis-table th { background-color: #f3f4f6; font-weight: bold; }
        .bg-orange-light { background-color: #ffedd5; }
        .signature-cell { text-align: left; padding-left: 10px; font-weight: bold; background-color: #fff; }
        
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 9999; display: flex; justify-content: center; align-items: center; }
        
        /* 垂直文字樣式 */
        .vertical-text { writing-mode: vertical-rl; text-orientation: mixed; transform: rotate(180deg); }
    </style>
</head>
<body class="bg-slate-100 text-slate-800">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- 內建圖標 ---
        const IconBase = ({ children, size = 16, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>{children}</svg>
        );
        const Icons = {
            Plus: (p) => <IconBase {...p}><path d="M5 12h14"/><path d="M12 5v14"/></IconBase>,
            Trash2: (p) => <IconBase {...p}><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></IconBase>,
            FileSpreadsheet: (p) => <IconBase {...p}><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/><path d="M8 13h2"/><path d="M8 17h2"/><path d="M14 13h2"/><path d="M14 17h2"/></IconBase>,
            Printer: (p) => <IconBase {...p}><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></IconBase>,
            Settings: (p) => <IconBase {...p}><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.47a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.35a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></IconBase>,
            Factory: (p) => <IconBase {...p}><path d="M2 20a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V8l-7 5V8l-7 5V4a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2Z"/><line x1="17" y1="18" x2="17" y2="18"/><line x1="12" y1="18" x2="12" y2="18"/><line x1="7" y1="18" x2="7" y2="18"/></IconBase>,
            CheckCircle: (p) => <IconBase {...p}><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></IconBase>,
            HelpCircle: (p) => <IconBase {...p}><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></IconBase>,
            Layout: (p) => <IconBase {...p}><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="9" y1="21" x2="9" y2="9"/></IconBase>,
            MoveUp: (p) => <IconBase {...p}><path d="M8 6L12 2L16 6"/><path d="M12 2V22"/></IconBase>,
            MoveDown: (p) => <IconBase {...p}><path d="M8 18L12 22L16 18"/><path d="M12 2V22"/></IconBase>,
            X: (p) => <IconBase {...p}><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></IconBase>,
            BarChart3: (p) => <IconBase {...p}><path d="M3 3v18h18"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/></IconBase>,
            Calculator: (p) => <IconBase {...p}><rect x="4" y="2" width="16" height="20" rx="2"/><line x1="8" y1="6" x2="16" y2="6"/><line x1="16" y1="14" x2="16" y2="14"/><line x1="12" y1="14" x2="12" y2="14"/><line x1="8" y1="14" x2="8" y2="14"/><line x1="16" y1="18" x2="16" y2="18"/><line x1="12" y1="18" x2="12" y2="18"/><line x1="8" y1="18" x2="8" y2="18"/></IconBase>,
            Scissors: (p) => <IconBase {...p}><circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><line x1="20" y1="4" x2="8.12" y2="15.88"/><line x1="14.47" y1="14.48" x2="20" y2="20"/><line x1="8.12" y1="8.12" x2="12" y2="12"/></IconBase>,
            Save: (p) => <IconBase {...p}><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></IconBase>,
            FolderOpen: (p) => <IconBase {...p}><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></IconBase>,
            FilePlus: (p) => <IconBase {...p}><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/><line x1="12" y1="18" x2="12" y2="12"/><line x1="9" y1="15" x2="15" y2="15"/></IconBase>,
        };

        const { Plus, Trash2, FileSpreadsheet, Printer, Settings, Factory, CheckCircle, HelpCircle, Layout, MoveUp, MoveDown, X, BarChart3, Calculator, Scissors, Save, FolderOpen, FilePlus } = Icons;

        const INITIAL_CATEGORIES = [
            { id: 'offline', label: '線下作業 (Off-line)', color: 'bg-slate-50 border-slate-300' },
            { id: 'main', label: '主線 (Main Line)', color: 'bg-blue-50 border-blue-200' },
        ];

        const TASK_TYPES = {
            process: { icon: Factory, label: '加工/操作', unicode: '○' },
            inspection: { icon: CheckCircle, label: '檢驗/檢查', unicode: '□' },
            decision: { icon: HelpCircle, label: '決策/判斷', unicode: '◇' }, 
            separator: { icon: Scissors, label: '分段/換人', unicode: '✂' } 
        };

        const loadState = (key, fallback) => {
            const saved = localStorage.getItem(key);
            return saved ? JSON.parse(saved) : fallback;
        };

        const App = () => {
            // --- State ---
            const [taktTime, setTaktTime] = useState(() => loadState('yz_takt', 180));
            const [productName, setProductName] = useState(() => loadState('yz_product', "MY27 ANYTOUR E+"));
            const [clientName, setClientName] = useState(() => loadState('yz_client', "OB"));
            const [lineName, setLineName] = useState(() => loadState('yz_line', "A2"));
            const [year, setYear] = useState(() => loadState('yz_year', "24"));
            const [allowance, setAllowance] = useState(() => loadState('yz_allowance', 1.05)); 
            const [workSeconds, setWorkSeconds] = useState(() => loadState('yz_workSeconds', 28800)); 
            const [processEngineer, setProcessEngineer] = useState(() => loadState('yz_pe', ""));
            const [timeStudyEngineer, setTimeStudyEngineer] = useState(() => loadState('yz_ie', ""));
            
            const [categories, setCategories] = useState(() => loadState('yz_categories', INITIAL_CATEGORIES));
            const [tasks, setTasks] = useState(() => loadState('yz_tasks', [
                { id: 1, category: 'offline', name: "擦拭車架", time: 15, desc: "", type: 'process' },
                { id: 2, category: 'offline', name: "MO與車架號碼綁關連", time: 10, desc: "刷條碼", type: 'process' },
                { id: 999, category: 'offline', name: "分段點", time: 0, desc: "", type: 'separator', manpower: 1 },
                { id: 4, category: 'offline', name: "後Sensor線組立", time: 37, desc: "", type: 'process' },
                { id: 8, category: 'main', name: "上輸送帶", time: 5, desc: "", type: 'process' },
                { id: 9, category: 'main', name: "馬達組立", time: 129, desc: "螺絲*4", type: 'process' },
            ]));

            const [newTask, setNewTask] = useState({ name: "", time: "", desc: "", type: 'process', category: 'main' });
            const [showSettings, setShowSettings] = useState(false);
            const [showFileMenu, setShowFileMenu] = useState(false);
            const chartRef = useRef(null);
            const chartInstance = useRef(null);

            // Auto-Save effects
            useEffect(() => localStorage.setItem('yz_takt', JSON.stringify(taktTime)), [taktTime]);
            useEffect(() => localStorage.setItem('yz_product', JSON.stringify(productName)), [productName]);
            useEffect(() => localStorage.setItem('yz_client', JSON.stringify(clientName)), [clientName]);
            useEffect(() => localStorage.setItem('yz_line', JSON.stringify(lineName)), [lineName]);
            useEffect(() => localStorage.setItem('yz_year', JSON.stringify(year)), [year]);
            useEffect(() => localStorage.setItem('yz_allowance', JSON.stringify(allowance)), [allowance]);
            useEffect(() => localStorage.setItem('yz_workSeconds', JSON.stringify(workSeconds)), [workSeconds]);
            useEffect(() => localStorage.setItem('yz_pe', JSON.stringify(processEngineer)), [processEngineer]);
            useEffect(() => localStorage.setItem('yz_ie', JSON.stringify(timeStudyEngineer)), [timeStudyEngineer]);
            useEffect(() => localStorage.setItem('yz_categories', JSON.stringify(categories)), [categories]);
            useEffect(() => localStorage.setItem('yz_tasks', JSON.stringify(tasks)), [tasks]);

            // --- Project Management ---
            const saveProject = () => {
                const name = prompt("請輸入專案存檔名稱：", `${productName} - ${new Date().toLocaleDateString()}`);
                if (!name) return;
                const projectData = {
                    id: Date.now(),
                    name: name,
                    timestamp: new Date().toLocaleString(),
                    data: { taktTime, productName, clientName, lineName, year, allowance, workSeconds, processEngineer, timeStudyEngineer, categories, tasks }
                };
                const savedProjects = JSON.parse(localStorage.getItem('yz_saved_projects') || '[]');
                savedProjects.push(projectData);
                localStorage.setItem('yz_saved_projects', JSON.stringify(savedProjects));
                alert("專案已儲存！");
            };
            const loadProject = (project) => {
                if(!confirm(`確定要載入「${project.name}」嗎？目前的未儲存進度將被覆蓋。`)) return;
                const d = project.data;
                setTaktTime(d.taktTime); setProductName(d.productName); setClientName(d.clientName); setLineName(d.lineName); setYear(d.year); setAllowance(d.allowance); setWorkSeconds(d.workSeconds); setProcessEngineer(d.processEngineer); setTimeStudyEngineer(d.timeStudyEngineer); setCategories(d.categories); setTasks(d.tasks);
                setShowFileMenu(false);
            };
            const deleteProject = (id) => {
                if(!confirm("確定要刪除此存檔？")) return;
                const savedProjects = JSON.parse(localStorage.getItem('yz_saved_projects') || '[]');
                const newProjects = savedProjects.filter(p => p.id !== id);
                localStorage.setItem('yz_saved_projects', JSON.stringify(newProjects));
                setShowFileMenu(false); setTimeout(() => setShowFileMenu(true), 10);
            };
            const createNewProject = () => {
                if(!confirm("確定要開新專案？目前的畫面將被清空。")) return;
                setTasks([]); setCategories(INITIAL_CATEGORIES); setProductName("New Project");
            };

            // --- Calculations ---
            const getSegments = () => {
                let allSegments = [];
                let totalManpower = 0;
                categories.forEach(cat => {
                    const laneTasks = tasks.filter(t => t.category === cat.id);
                    let currentSegmentTime = 0;
                    let hasSeparator = false;
                    let laneManpower = 0;
                    let tasksInSegment = 0;
                    laneTasks.forEach((task) => {
                        if (task.type === 'separator') {
                            hasSeparator = true;
                            allSegments.push(currentSegmentTime);
                            laneManpower += (task.manpower || 1);
                            currentSegmentTime = 0;
                            tasksInSegment = 0;
                        } else {
                            currentSegmentTime += (task.time || 0);
                            tasksInSegment++;
                        }
                    });
                    if (tasksInSegment > 0 || !hasSeparator) { allSegments.push(currentSegmentTime); laneManpower += 1; }
                    if (laneTasks.length === 0) laneManpower = 0;
                    totalManpower += laneManpower;
                });
                return { allSegments, totalManpower };
            };

            const stats = (() => {
                const totalTime = tasks.reduce((sum, t) => t.type !== 'separator' ? sum + t.time : sum, 0);
                const { allSegments, totalManpower } = getSegments();
                const maxStationTime = Math.max(...allSegments, 0);
                const lineSpeed = maxStationTime > 0 ? maxStationTime : taktTime;
                const dailyCapacity = lineSpeed > 0 ? (workSeconds / lineSpeed).toFixed(0) : 0;
                const balanceRate = (lineSpeed > 0 && totalManpower > 0) ? ((totalTime / (lineSpeed * totalManpower)) * 100).toFixed(2) : 0;
                const standardTime = (totalTime * allowance).toFixed(2);
                return { totalTime, manpower: totalManpower, lineSpeed, dailyCapacity, balanceRate, standardTime };
            })();

            useEffect(() => {
                if (chartInstance.current) chartInstance.current.destroy();
                if (chartRef.current) {
                    const ctx = chartRef.current.getContext('2d');
                    const dataValues = categories.map(cat => tasks.filter(t => t.category === cat.id && t.type !== 'separator').reduce((sum, t) => sum + t.time, 0));
                    const labels = categories.map(cat => cat.label.split(' ')[0]);
                    const backgroundColors = dataValues.map(val => val > taktTime ? '#ef4444' : '#3b82f6');
                    chartInstance.current = new Chart(ctx, {
                        type: 'bar',
                        data: {
                            labels: labels,
                            datasets: [{ label: '總工時', data: dataValues, backgroundColor: backgroundColors, borderRadius: 4 }, { label: '目標節拍', data: Array(labels.length).fill(taktTime), type: 'line', borderColor: '#ef4444', borderDash: [5, 5], pointStyle: false }]
                        },
                        options: { responsive: true, maintainAspectRatio: false, scales: { y: { beginAtZero: true } } }
                    });
                }
            }, [tasks, categories, taktTime]);

            // Drag Drop
            const [draggedItem, setDraggedItem] = useState(null);
            const handleDragStart = (e, task) => { setDraggedItem(task); e.dataTransfer.effectAllowed = "move"; setTimeout(() => e.target.classList.add('opacity-50'), 0); };
            const handleDragEnd = (e) => { e.target.classList.remove('opacity-50'); setDraggedItem(null); };
            const handleDragOver = (e) => e.preventDefault();
            const handleDrop = (e, targetTask) => {
                e.preventDefault();
                if (!draggedItem || draggedItem.id === targetTask.id) return;
                const newTasks = [...tasks];
                const oldIdx = newTasks.findIndex(t => t.id === draggedItem.id);
                if (draggedItem.category !== targetTask.category) newTasks[oldIdx].category = targetTask.category;
                newTasks.splice(oldIdx, 1);
                if (targetTask.id === 'DROP_ZONE') newTasks.push({...draggedItem, category: targetTask.category});
                else { const newIdx = newTasks.findIndex(t => t.id === targetTask.id); newTasks.splice(newIdx, 0, draggedItem); }
                setTasks(newTasks);
            };

            // Actions
            const addSeparator = () => {
                let cat = newTask.category;
                if(!categories.find(c => c.id === cat)) cat = categories[0].id;
                const others = tasks.filter(t => t.category !== cat);
                const current = tasks.filter(t => t.category === cat);
                setTasks([...others, ...current, { id: Date.now(), category: cat, name: "分段點", time: 0, desc: "換人/段落結束", type: 'separator', manpower: 1 }]);
            };
            const moveCategory = (index, direction) => {
                const newCats = [...categories];
                const target = index + direction;
                if (target >= 0 && target < newCats.length) { [newCats[index], newCats[target]] = [newCats[target], newCats[index]]; setCategories(newCats); }
            };
            const deleteCategory = (id) => { if(confirm("確定刪除？")) { setCategories(categories.filter(c => c.id !== id)); setTasks(tasks.filter(t => t.category !== id)); }};
            const handleAddTask = () => {
                if(!newTask.name || !newTask.time) return;
                let cat = newTask.category;
                if(!categories.find(c => c.id === cat)) cat = categories[0].id;
                setTasks([...tasks, { ...newTask, id: Date.now(), time: Number(newTask.time), category: cat }]);
                setNewTask({ ...newTask, name: "", time: "", desc: "" });
            };
            const handleDeleteTask = (id) => setTasks(tasks.filter(t => t.id !== id));
            const addCategory = () => { const name = prompt("輸入新產線名稱:"); if(name) setCategories([...categories, { id: 'cat_'+Date.now(), label: name, color: 'bg-indigo-50 border-indigo-200' }]); };

            // ✅ 修復 - 使用正確的 MIME 類型 + CSV 格式（手機和電腦都相容）
            const exportToXLS = () => {
                try {
                    const dateStr = new Date().toLocaleDateString('zh-TW');

                    // Step 1: 為每個 category 準備分段資訊
                    const categorySegments = {};
                    categories.forEach(cat => {
                        const segments = [];
                        let currentSegment = { tasks: [] };

                        tasks.filter(t => t.category === cat.id).forEach(task => {
                            if (task.type === 'separator') {
                                if (currentSegment.tasks.length > 0) {
                                    currentSegment.totalTime = currentSegment.tasks.reduce((sum, t) => sum + t.time, 0);
                                    segments.push({...currentSegment});
                                }
                                segments.push({ isSeparator: true, manpower: task.manpower || 1 });
                                currentSegment = { tasks: [] };
                            } else {
                                currentSegment.tasks.push(task);
                            }
                        });

                        if (currentSegment.tasks.length > 0) {
                            currentSegment.totalTime = currentSegment.tasks.reduce((sum, t) => sum + t.time, 0);
                            segments.push({...currentSegment});
                        }

                        categorySegments[cat.id] = segments;
                    });

                    // Step 2: 使用 TSV 格式（製表符分隔）- 更穩定，手機直接開啟無亂碼
                    const colsPerCat = 5;
                    const totalCols = categories.length * colsPerCat;
                    let lines = [];

                    // 標題行
                    const titleRow = Array(totalCols).fill(`MY27 / G9 ${productName} 裝配操作程序圖`);
                    lines.push(titleRow.join('\t'));

                    // 元資訊行
                    let infoRow = [];
                    for (let i = 0; i < categories.length; i++) {
                        let info = '';
                        if (i === 0) info = `客戶: ${clientName}`;
                        else if (i === 1) info = `年度: ${year}`;
                        else if (i === 2) info = `生產線: ${lineName}`;
                        else if (i === 3) info = `日期: ${dateStr}`;
                        infoRow.push(info);
                        for (let j = 1; j < colsPerCat; j++) infoRow.push('');
                    }
                    lines.push(infoRow.join('\t'));

                    // 產線標題行
                    let catTitleRow = [];
                    categories.forEach(cat => {
                        catTitleRow.push(cat.label);
                        for (let j = 1; j < colsPerCat; j++) catTitleRow.push('');
                    });
                    lines.push(catTitleRow.join('\t'));

                    // 計算最大行數
                    const maxRowsPerCat = Math.max(...categories.map(cat => {
                        let count = 0;
                        categorySegments[cat.id].forEach(seg => {
                            count += seg.isSeparator ? 1 : seg.tasks.length;
                        });
                        return count;
                    }), 1);

                    // 逐行輸出
                    for (let rowIdx = 0; rowIdx < maxRowsPerCat; rowIdx++) {
                        let row = [];
                        
                        categories.forEach(cat => {
                            let rowCounter = 0;
                            let isFound = false;
                            
                            for (let seg of categorySegments[cat.id]) {
                                if (seg.isSeparator) {
                                    if (rowCounter === rowIdx) {
                                        row.push(`▼分段(${seg.manpower}人)`);
                                        for (let j = 1; j < colsPerCat; j++) row.push('');
                                        isFound = true;
                                        break;
                                    }
                                    rowCounter += 1;
                                } else {
                                    for (let taskIdx = 0; taskIdx < seg.tasks.length; taskIdx++) {
                                        if (rowCounter === rowIdx) {
                                            const task = seg.tasks[taskIdx];
                                            const symbol = TASK_TYPES[task.type]?.unicode || 'O';
                                            const timeStr = taskIdx === 0 ? seg.totalTime + 's' : '';
                                            
                                            row.push(timeStr);
                                            row.push(symbol);
                                            row.push(task.time + 's');
                                            row.push(task.name);
                                            row.push(task.desc || '');
                                            
                                            isFound = true;
                                            break;
                                        }
                                        rowCounter += 1;
                                    }
                                    if (isFound) break;
                                }
                            }
                            
                            if (!isFound) {
                                for (let j = 0; j < colsPerCat; j++) row.push('');
                            }
                        });
                        
                        lines.push(row.join('\t'));
                    }

                    // 分析表空行
                    lines.push('');

                    // 分析表標題
                    lines.push('生產數據分析表');
                    lines.push('');

                    // 分析表標頭
                    const analysisHeader = ['總工時', '定員', '線速', '平衡率', '日產能', '標準工時'];
                    lines.push(analysisHeader.join('\t'));

                    // 分析表數據
                    const analysisData = [
                        stats.totalTime,
                        stats.manpower,
                        stats.lineSpeed,
                        stats.balanceRate + '%',
                        stats.dailyCapacity,
                        stats.standardTime
                    ];
                    lines.push(analysisData.join('\t'));

                    // 簽章行
                    lines.push('');
                    lines.push(`流程製訂: ${processEngineer}\t工時製訂: ${timeStudyEngineer}`);

                    // Step 3: 建立 Blob 並下載
                    const finalTSV = lines.join('\n');
                    const bom = '\uFEFF'; // UTF-8 BOM 標記
                    const blob = new Blob([bom + finalTSV], { type: 'text/tab-separated-values;charset=utf-8' });
                    
                    const link = document.createElement('a');
                    link.href = URL.createObjectURL(blob);
                    // 檔名改用 .xls 讓 Excel 直接識別
                    link.download = `${productName.replace(/[\/\\:*?"<>|]/g, '_')}_${dateStr.replace(/\//g, '-')}.xls`;
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                    URL.revokeObjectURL(link.href);
                    
                } catch(err) {
                    console.error('Excel export error:', err);
                    alert('匯出失敗：' + err.message);
                }
            };

            const SavedProjectsModal = () => {
                const savedProjects = JSON.parse(localStorage.getItem('yz_saved_projects') || '[]');
                return (
                    <div className="modal-overlay" onClick={() => setShowFileMenu(false)}>
                        <div className="bg-white p-6 rounded-lg shadow-xl w-[500px] max-h-[80vh] overflow-y-auto" onClick={e=>e.stopPropagation()}>
                            <div className="flex justify-between items-center mb-4">
                                <h3 className="text-xl font-bold flex items-center gap-2"><FolderOpen className="text-blue-600"/> 專案管理 (存檔紀錄)</h3>
                                <button onClick={() => setShowFileMenu(false)}><X/></button>
                            </div>
                            {savedProjects.length === 0 ? (
                                <p className="text-center text-slate-500 py-10">目前沒有儲存的專案。</p>
                            ) : (
                                <div className="space-y-3">
                                    {savedProjects.map(p => (
                                        <div key={p.id} className="border p-3 rounded flex justify-between items-center hover:bg-slate-50">
                                            <div>
                                                <div className="font-bold text-slate-800">{p.name}</div>
                                                <div className="text-xs text-slate-500">{p.timestamp}</div>
                                            </div>
                                            <div className="flex gap-2">
                                                <button onClick={() => loadProject(p)} className="bg-blue-100 text-blue-600 px-3 py-1 rounded text-sm hover:bg-blue-200">讀取</button>
                                                <button onClick={() => deleteProject(p.id)} className="text-red-400 hover:text-red-600 p-1"><Trash2 size={16}/></button>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            )}
                        </div>
                    </div>
                );
            };

            return (
                <div className="min-h-screen pb-20">
                    <nav className="bg-slate-900 text-white p-4 shadow-lg sticky top-0 z-50 no-print">
                        <div className="max-w-[1800px] mx-auto flex justify-between items-center">
                            <div className="flex items-center space-x-2"><Layout size={24} className="text-blue-400" /><h1 className="text-xl font-bold">智慧裝配山積圖 (專案管理版)</h1></div>
                            <div className="flex space-x-2">
                                <button onClick={createNewProject} className="flex items-center space-x-2 bg-slate-700 px-3 py-2 rounded text-sm hover:bg-slate-600"><FilePlus size={16} /> <span>開新檔案</span></button>
                                <button onClick={() => setShowFileMenu(true)} className="flex items-center space-x-2 bg-slate-700 px-3 py-2 rounded text-sm hover:bg-slate-600"><FolderOpen size={16} /> <span>開啟舊檔</span></button>
                                <button onClick={saveProject} className="flex items-center space-x-2 bg-blue-600 px-3 py-2 rounded text-sm hover:bg-blue-500"><Save size={16} /> <span>儲存專案</span></button>
                                <div className="w-[1px] h-8 bg-slate-600 mx-2"></div>
                                <button onClick={() => setShowSettings(!showSettings)} className="flex items-center space-x-2 bg-slate-700 px-3 py-2 rounded text-sm"><Settings size={16} /> <span>設定</span></button>
                                <button onClick={exportToXLS} className="flex items-center space-x-2 bg-green-600 px-3 py-2 rounded text-sm border border-green-500"><FileSpreadsheet size={16} /> <span>匯出 Excel</span></button>
                            </div>
                        </div>
                    </nav>

                    {showFileMenu && <SavedProjectsModal />}

                    {showSettings && (
                        <div className="bg-white border-b border-slate-200 p-6 no-print animate-fade-in">
                            <div className="max-w-[1800px] mx-auto">
                                <h3 className="font-bold text-slate-800 mb-4 flex items-center gap-2"><Settings size={18} /> 產線排版設定</h3>
                                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-5 gap-4">
                                    {categories.map((cat, idx) => (
                                        <div key={cat.id} className={`p-3 rounded border flex flex-col gap-2 ${cat.color} transition-all hover:shadow-md`}>
                                            <div className="flex justify-between items-center"><span className="text-xs font-mono text-slate-500">Col {idx + 1}</span><div className="flex gap-1"><button onClick={() => moveCategory(idx, -1)} disabled={idx===0} className="p-1 hover:bg-white rounded disabled:opacity-30"><MoveUp size={14} className="-rotate-90"/></button><button onClick={() => moveCategory(idx, 1)} disabled={idx===categories.length-1} className="p-1 hover:bg-white rounded disabled:opacity-30"><MoveDown size={14} className="-rotate-90"/></button><button onClick={() => deleteCategory(cat.id)} className="p-1 hover:bg-red-100 text-red-500 rounded"><X size={14}/></button></div></div>
                                            <input type="text" value={cat.label} onChange={(e) => { const newCats = [...categories]; newCats[idx].label = e.target.value; setCategories(newCats); }} className="w-full bg-white/50 border border-slate-300 rounded px-2 py-1 text-sm font-bold"/>
                                        </div>
                                    ))}
                                    <button onClick={addCategory} className="border-2 border-dashed border-slate-300 rounded p-3 flex flex-col items-center justify-center text-slate-400 hover:border-blue-400 hover:text-blue-500 transition min-h-[100px]"><Plus size={24} /> <span className="text-sm">新增產線</span></button>
                                </div>
                            </div>
                        </div>
                    )}

                    <main className="max-w-[1800px] mx-auto p-6 space-y-6">
                        {/* 專案資訊 */}
                        <div className="grid grid-cols-1 xl:grid-cols-12 gap-6 no-print">
                            <div className="xl:col-span-3 bg-white p-5 rounded-xl shadow border">
                                <h2 className="font-bold text-slate-700 mb-3">專案資訊</h2>
                                <div className="space-y-2 text-sm">
                                    <div className="grid grid-cols-2 gap-2"><div><label className="text-xs text-slate-400">客戶</label><input type="text" value={clientName} onChange={e=>setClientName(e.target.value)} className="w-full border rounded px-2 py-1"/></div><div><label className="text-xs text-slate-400">年度</label><input type="text" value={year} onChange={e=>setYear(e.target.value)} className="w-full border rounded px-2 py-1"/></div></div>
                                    <div><label className="text-xs text-slate-400">車種</label><input type="text" value={productName} onChange={e=>setProductName(e.target.value)} className="w-full border rounded px-2 py-1"/></div>
                                    <div className="grid grid-cols-2 gap-2">
                                        <div><label className="text-slate-400 text-xs">產線代號</label><input type="text" value={lineName} onChange={e=>setLineName(e.target.value)} className="w-full border rounded px-2 py-1 font-bold"/></div>
                                        <div><label className="text-slate-400 text-xs">寬放率</label><input type="number" step="0.01" value={allowance} onChange={e=>setAllowance(Number(e.target.value))} className="w-full border rounded px-2 py-1"/></div>
                                    </div>
                                    <div className="grid grid-cols-2 gap-2">
                                        <div><label className="text-slate-400 text-xs">流程製訂</label><input type="text" value={processEngineer} onChange={e=>setProcessEngineer(e.target.value)} className="w-full border rounded px-2 py-1"/></div>
                                        <div><label className="text-slate-400 text-xs">工時製訂</label><input type="text" value={timeStudyEngineer} onChange={e=>setTimeStudyEngineer(e.target.value)} className="w-full border rounded px-2 py-1"/></div>
                                    </div>
                                    <div><label className="text-xs text-slate-400">目標節拍 (Takt)</label><input type="number" value={taktTime} onChange={e=>setTaktTime(Number(e.target.value))} className="w-full border rounded px-2 py-1 font-mono text-blue-600 font-bold"/></div>
                                </div>
                            </div>

                            {/* 任務輸入 */}
                            <div className="xl:col-span-6 bg-white p-5 rounded-xl shadow border">
                                <h2 className="font-bold text-slate-700 mb-4 flex gap-2"><Plus size={18}/> 新增項目</h2>
                                <div className="grid grid-cols-12 gap-2 items-end">
                                    <div className="col-span-3"><label className="text-xs text-slate-400">位置</label><select value={newTask.category} onChange={e=>setNewTask({...newTask, category: e.target.value})} className="w-full border p-2 rounded text-sm">{categories.map(c=><option key={c.id} value={c.id}>{c.label}</option>)}</select></div>
                                    <div className="col-span-4"><label className="text-xs text-slate-400">名稱</label><input type="text" value={newTask.name} onChange={e=>setNewTask({...newTask, name: e.target.value})} className="w-full border p-2 rounded text-sm"/></div>
                                    <div className="col-span-2"><label className="text-xs text-slate-400">工時(s)</label><input type="number" value={newTask.time} onChange={e=>setNewTask({...newTask, time: e.target.value})} className="w-full border p-2 rounded text-sm"/></div>
                                    <div className="col-span-3 flex gap-1">
                                        <button onClick={handleAddTask} className="flex-1 bg-blue-600 text-white p-2 rounded hover:bg-blue-700"><Plus size={20} className="mx-auto"/></button>
                                        <button onClick={addSeparator} className="flex-1 bg-orange-500 text-white p-2 rounded hover:bg-orange-600" title="插入分段"><Scissors size={20} className="mx-auto"/></button>
                                    </div>
                                </div>
                            </div>
                            <div className="xl:col-span-3 bg-white p-5 rounded-xl shadow border"><div className="chart-container"><canvas ref={chartRef}></canvas></div></div>
                        </div>

                        {/* 泳道圖區域 */}
                        <div className="bg-white p-6 rounded-xl shadow border min-h-[600px]">
                            <div className="flex gap-4 overflow-x-auto pb-4 mb-8">
                                {categories.map((cat) => {
                                    const laneTasks = tasks.filter(t => t.category === cat.id);
                                    
                                    // --- Grouping Logic for Swimlane Display ---
                                    const segments = [];
                                    let currentSegment = { tasks: [], time: 0, separator: null };

                                    laneTasks.forEach(task => {
                                        if (task.type === 'separator') {
                                            currentSegment.separator = task;
                                            segments.push(currentSegment);
                                            currentSegment = { tasks: [], time: 0, separator: null };
                                        } else {
                                            currentSegment.tasks.push(task);
                                            currentSegment.time += task.time;
                                        }
                                    });
                                    if (currentSegment.tasks.length > 0 || segments.length === 0) {
                                        segments.push(currentSegment);
                                    }

                                    return (
                                        <div key={cat.id} className={`flex-shrink-0 w-[300px] flex flex-col h-full rounded-lg border-2 ${cat.color} p-2`}>
                                            <div className="font-bold text-center mb-2">{cat.label}</div>
                                            <div className="flex-grow space-y-2 overflow-y-auto max-h-[800px]" onDragOver={handleDragOver} onDrop={e=>handleDrop(e,{category:cat.id, id:'DROP_ZONE'})}>
                                                
                                                {segments.map((seg, segIdx) => (
                                                    <div key={segIdx} className="flex border-b border-slate-200/50 pb-2 mb-2 last:border-0">
                                                        {/* LEFT SIDE: Time Indicator */}
                                                        <div className={`w-8 rounded-l flex items-center justify-center border-r mr-2 transition-colors ${seg.time > taktTime ? 'bg-red-100 border-red-200' : 'bg-slate-100 border-slate-200'}`}>
                                                            <div className={`text-xs font-bold whitespace-nowrap ${seg.time > taktTime ? 'text-red-600' : 'text-slate-500'}`} style={{writingMode: 'vertical-rl', transform: 'rotate(180deg)'}}>
                                                                {seg.time}s
                                                            </div>
                                                        </div>

                                                        {/* RIGHT SIDE: Tasks */}
                                                        <div className="flex-1 space-y-2">
                                                            {seg.tasks.map(task => (
                                                                <div key={task.id} draggable onDragStart={e=>handleDragStart(e,task)} onDragEnd={handleDragEnd} onDrop={e=>{e.stopPropagation();handleDrop(e,task)}} className="relative bg-white p-3 rounded shadow-sm border border-slate-200 cursor-grab group hover:border-blue-400">
                                                                    <div className="flex justify-between"><span className="font-bold text-sm">{task.name}</span><span className="text-xs bg-slate-100 px-1 rounded">{task.time}s</span></div>
                                                                    <button onClick={() => handleDeleteTask(task.id)} className="absolute right-2 top-2 opacity-0 group-hover:opacity-100 text-slate-300 hover:text-red-500"><Trash2 size={14}/></button>
                                                                </div>
                                                            ))}
                                                            
                                                            {/* Separator Node */}
                                                            {seg.separator && (
                                                                <div draggable onDragStart={e=>handleDragStart(e,seg.separator)} onDragEnd={handleDragEnd} onDrop={e=>{e.stopPropagation();handleDrop(e,seg.separator)}} className="p-1 bg-orange-50 border-2 border-dashed border-orange-300 rounded text-center relative group cursor-grab">
                                                                    <div className="text-[10px] font-bold text-orange-600 mb-1">▼ 分段</div>
                                                                    <div className="flex justify-center items-center gap-1 text-[10px] text-slate-600">
                                                                        人: <input type="number" value={seg.separator.manpower || 1} onChange={(e)=>{const newTasks=[...tasks]; newTasks[tasks.findIndex(t=>t.id===seg.separator.id)].manpower=Number(e.target.value); setTasks(newTasks);}} className="w-8 text-center border rounded bg-white" min="0"/>
                                                                    </div>
                                                                    <button onClick={() => handleDeleteTask(seg.separator.id)} className="absolute right-1 top-1 text-slate-400 hover:text-red-500"><Trash2 size={12}/></button>
                                                                </div>
                                                            )}
                                                        </div>
                                                    </div>
                                                ))}

                                                <div className="h-10 border-2 border-dashed border-slate-200 rounded flex items-center justify-center text-slate-300 text-xs">拖曳至此</div>
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>
                            
                            {/* 生產分析表 */}
                            <div className="border-t pt-4 mt-4">
                                <h3 className="font-bold mb-2">生產數據分析 (含分段計算)</h3>
                                <table className="analysis-table">
                                    <thead><tr><th>總工時</th><th>定員 (含分段)</th><th>瓶頸工時 (線速)</th><th>平衡率</th><th>日產能</th><th>標準工時</th></tr></thead>
                                    <tbody>
                                        <tr>
                                            <td>{stats.totalTime}</td><td className="bg-orange-light font-bold">{stats.manpower}</td><td className={stats.lineSpeed > taktTime ? "text-red-600 font-bold" : "text-green-600 font-bold"}>{stats.lineSpeed}</td><td>{stats.balanceRate}%</td><td>{stats.dailyCapacity}</td><td>{stats.standardTime}</td>
                                        </tr>
                                        <tr>
                                            <td className="font-bold bg-gray-50 text-right">流程製訂：</td>
                                            <td colSpan="2" className="text-left font-bold">{processEngineer}</td>
                                            <td className="font-bold bg-gray-50 text-right">工時製訂：</td>
                                            <td colSpan="2" className="text-left font-bold">{timeStudyEngineer}</td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </main>
                </div>
            );
        };
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
