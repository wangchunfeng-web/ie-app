<script>
const e = React.createElement;
const { useState, useEffect, useRef } = React;

/* ========= 基本設定 ========= */
const INITIAL_CATEGORIES = [
  { id: 'offline', label: '線下作業', color: 'bg-slate-50 border-slate-300' },
  { id: 'main', label: '主線', color: 'bg-blue-50 border-blue-200' },
];

const TASK_TYPES = {
  process: '○',
  inspection: '□',
  decision: '◇',
  separator: '✂'
};

function App() {
  /* ========= 狀態 ========= */
  const [takt, setTakt] = useState(180);
  const [categories, setCategories] = useState(INITIAL_CATEGORIES);
  const [tasks, setTasks] = useState([
    { id: 1, category: 'offline', name: '擦拭車架', time: 15, type: 'process' },
    { id: 2, category: 'offline', name: '條碼綁定', time: 10, type: 'process' },
    { id: 3, category: 'offline', name: '分段', time: 0, type: 'separator', manpower: 1 },
    { id: 4, category: 'offline', name: '線組立', time: 37, type: 'process' },
    { id: 5, category: 'main', name: '馬達組立', time: 129, type: 'process' },
  ]);

  /* ========= 計算 ========= */
  function calcSegments(catId) {
    const list = tasks.filter(t => t.category === catId);
    const segs = [];
    let current = { time: 0, tasks: [], manpower: 1 };

    list.forEach(t => {
      if (t.type === 'separator') {
        segs.push(current);
        current = { time: 0, tasks: [], manpower: t.manpower || 1 };
      } else {
        current.tasks.push(t);
        current.time += t.time;
      }
    });
    segs.push(current);
    return segs;
  }

  /* ========= Chart ========= */
  const chartRef = useRef(null);
  const chartIns = useRef(null);

  useEffect(() => {
    if (!chartRef.current) return;
    if (chartIns.current) chartIns.current.destroy();

    const labels = [];
    const data = [];
    const colors = [];

    categories.forEach(c => {
      calcSegments(c.id).forEach((s, i) => {
        labels.push(c.label + '-' + (i + 1));
        data.push(s.time);
        colors.push(s.time > takt ? '#ef4444' : '#3b82f6');
      });
    });

    chartIns.current = new Chart(chartRef.current, {
      type: 'bar',
      data: {
        labels,
        datasets: [{
          label: '工位工時',
          data,
          backgroundColor: colors,
          borderRadius: 4
        },{
          label: '目標節拍',
          data: Array(labels.length).fill(takt),
          type: 'line',
          borderColor: '#ef4444',
          borderDash: [5,5],
          pointRadius: 0
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        scales: { y: { beginAtZero: true } }
      }
    });
  }, [tasks, takt]);

  /* ========= UI ========= */
  return e(
    'div',
    { className: 'min-h-screen p-4 space-y-4' },

    e('h1', { className: 'text-xl font-bold' }, '智慧山積圖'),

    e('div', { className: 'bg-white p-3 rounded shadow flex gap-2 items-center' },
      e('span', null, '節拍'),
      e('input', {
        type: 'number',
        value: takt,
        onChange: ev => setTakt(Number(ev.target.value)),
        className: 'border px-2 py-1 w-20'
      })
    ),

    e('div', { className: 'bg-white p-4 rounded shadow h-[250px]' },
      e('canvas', { ref: chartRef })
    ),

    e('div', { className: 'flex gap-4 overflow-x-auto' },
      categories.map(cat =>
        e('div',
          {
            key: cat.id,
            className: `w-[280px] border-2 rounded p-2 flex-shrink-0 ${cat.color}`
          },
          e('div', { className: 'font-bold mb-2 text-center' }, cat.label),
          calcSegments(cat.id).map((seg, i) =>
            e('div',
              {
                key: i,
                className: `mb-2 p-2 rounded border ${
                  seg.time > takt ? 'bg-red-50 border-red-300' : 'bg-white'
                }`
              },
              e('div', { className: 'text-xs mb-1' }, `工時 ${seg.time}s / ${seg.manpower}人`),
              seg.tasks.map(t =>
                e('div',
                  { key: t.id, className: 'text-sm flex justify-between' },
                  e('span', null, `${TASK_TYPES[t.type]} ${t.name}`),
                  e('span', null, t.time)
                )
              )
            )
          )
        )
      )
    )
  );
}

/* ========= Render ========= */
ReactDOM.createRoot(document.getElementById('root'))
  .render(e(App));
</script>
