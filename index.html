<script>
const e = React.createElement;
const { useState, useEffect, useRef } = React;

const STORAGE_KEY = 'yamazumi-app-v1';

const TASK_TYPES = {
  process: '○',
  inspection: '□',
  decision: '◇',
  separator: '✂'
};

const DEFAULT_DATA = {
  takt: 180,
  categories: [
    { id: 'offline', label: '線下作業', color: 'bg-slate-50 border-slate-300' },
    { id: 'main', label: '主線', color: 'bg-blue-50 border-blue-200' }
  ],
  tasks: [
    { id: 1, category: 'offline', name: '擦拭車架', time: 15, type: 'process' },
    { id: 2, category: 'offline', name: '條碼綁定', time: 10, type: 'process' },
    { id: 3, category: 'offline', type: 'separator', manpower: 1 },
    { id: 4, category: 'offline', name: '線組立', time: 37, type: 'process' },
    { id: 5, category: 'main', name: '馬達組立', time: 129, type: 'process' }
  ]
};

function App() {
  const [data, setData] = useState(() => {
    const saved = localStorage.getItem(STORAGE_KEY);
    return saved ? JSON.parse(saved) : DEFAULT_DATA;
  });

  const { takt, categories, tasks } = data;

  useEffect(() => {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  }, [data]);

  function update(patch) {
    setData(d => ({ ...d, ...patch }));
  }

  function calcSegments(catId) {
    const list = tasks.filter(t => t.category === catId);
    const segs = [];
    let cur = { time: 0, tasks: [], manpower: 1 };

    list.forEach(t => {
      if (t.type === 'separator') {
        segs.push(cur);
        cur = { time: 0, tasks: [], manpower: t.manpower || 1 };
      } else {
        cur.tasks.push(t);
        cur.time += t.time;
      }
    });
    segs.push(cur);
    return segs;
  }

  /* ===== Chart ===== */
  const chartRef = useRef(null);
  const chartIns = useRef(null);

  useEffect(() => {
    if (!chartRef.current) return;
    if (chartIns.current) chartIns.current.destroy();

    const labels = [];
    const dataSet = [];
    const colors = [];

    categories.forEach(c => {
      calcSegments(c.id).forEach((s, i) => {
        labels.push(`${c.label}-${i + 1}`);
        dataSet.push(s.time);
        colors.push(s.time > takt ? '#ef4444' : '#3b82f6');
      });
    });

    chartIns.current = new Chart(chartRef.current, {
      type: 'bar',
      data: {
        labels,
        datasets: [{
          label: '工時',
          data: dataSet,
          backgroundColor: colors
        },{
          label: 'Takt',
          type: 'line',
          data: Array(labels.length).fill(takt),
          borderColor: '#ef4444',
          borderDash: [6,4],
          pointRadius: 0
        }]
      },
      options: { responsive: true, maintainAspectRatio: false }
    });
  }, [data]);

  /* ===== UI ===== */
  function addTask(catId) {
    const name = prompt('作業名稱');
    const time = Number(prompt('工時 (秒)'));
    if (!name || !time) return;
    update({
      tasks: [...tasks, {
        id: Date.now(),
        category: catId,
        name,
        time,
        type: 'process'
      }]
    });
  }

  function addSeparator(catId) {
    update({
      tasks: [...tasks, {
        id: Date.now(),
        category: catId,
        type: 'separator',
        manpower: 1
      }]
    });
  }

  return e('div', { className: 'min-h-screen p-4 space-y-4' },
    e('h1', { className: 'text-xl font-bold' }, '智慧山積圖'),

    e('div', { className: 'bg-white p-3 rounded shadow flex gap-2' },
      e('span', null, 'Takt'),
      e('input', {
        type: 'number',
        value: takt,
        className: 'border px-2 w-20',
        onChange: ev => update({ takt: Number(ev.target.value) })
      })
    ),

    e('div', { className: 'bg-white p-4 rounded shadow h-[260px]' },
      e('canvas', { ref: chartRef })
    ),

    e('div', { className: 'flex gap-4 overflow-x-auto' },
      categories.map(cat =>
        e('div', {
          key: cat.id,
          className: `w-[300px] border-2 rounded p-2 ${cat.color}`
        },
          e('div', { className: 'font-bold mb-2 text-center' }, cat.label),

          calcSegments(cat.id).map((seg, i) =>
            e('div', {
              key: i,
              className: `mb-2 p-2 rounded border ${
                seg.time > takt ? 'bg-red-50 border-red-300' : 'bg-white'
              }`
            },
              e('div', { className: 'text-xs mb-1' },
                `工時 ${seg.time}s / ${seg.manpower}人`
              ),
              seg.tasks.map(t =>
                e('div', { key: t.id, className: 'text-sm flex justify-between' },
                  e('span', null, `${TASK_TYPES[t.type]} ${t.name}`),
                  e('span', null, t.time)
                )
              )
            )
          ),

          e('div', { className: 'flex gap-1 mt-2' },
            e('button', {
              className: 'text-xs bg-blue-600 text-white px-2 py-1 rounded',
              onClick: () => addTask(cat.id)
            }, '+ 作業'),
            e('button', {
              className: 'text-xs bg-gray-500 text-white px-2 py-1 rounded',
              onClick: () => addSeparator(cat.id)
            }, '+ 分段')
          )
        )
      )
    )
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(e(App));
</script>
