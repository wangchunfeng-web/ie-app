<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>智慧山積圖 PWA</title>

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f172a">
<link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/2921/2921226.png">
<link rel="manifest" id="manifest-placeholder">

<script src="https://cdn.tailwindcss.com"></script>
<script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

<style>
body { -webkit-tap-highlight-color: transparent; touch-action: manipulation; background: #f1f5f9; font-family: sans-serif; }
.chart-container { position: relative; width: 100%; height: 250px; max-height: 400px; }
.lane-scroll::-webkit-scrollbar { width: 4px; height: 4px; }
.lane-scroll::-webkit-scrollbar-track { background: #f1f5f9; }
.lane-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
.analysis-table { border-collapse: collapse; width: 100%; font-size: 13px; text-align: center; }
.analysis-table th, .analysis-table td { border: 1px solid #000; padding: 4px; }
.analysis-table th { background-color: #f3f4f6; font-weight: bold; }
.bg-orange-light { background-color: #ffedd5; }
.modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 9999; display: flex; justify-content: center; align-items: center; padding: 20px; }
input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
input[type=number] { -moz-appearance: textfield; }
</style>
</head>
<body>
<div id="root"></div>

<script>
const manifest = {
  "name": "智慧山積圖",
  "short_name": "山積圖",
  "start_url": ".",
  "display": "standalone",
  "background_color": "#f1f5f9",
  "theme_color": "#0f172a",
  "icons": [{ "src": "https://cdn-icons-png.flaticon.com/512/2921/2921226.png", "sizes": "512x512", "type": "image/png" }]
};
const blob = new Blob([JSON.stringify(manifest)], {type: 'application/json'});
document.querySelector('#manifest-placeholder').setAttribute('href', URL.createObjectURL(blob));
</script>

<script type="text/babel">
const { useState, useEffect, useRef } = React;

// --- App 功能核心 ---
const App = () => {
  const [tasks, setTasks] = useState([
    { id: 1, name: '工序 A', person: '張三', standard: 5, actual: 3, stage: '前段', lane: 1 },
    { id: 2, name: '工序 B', person: '李四', standard: 3, actual: 2, stage: '後段', lane: 2 },
  ]);

  const chartRef = useRef(null);

  useEffect(() => {
    drawChart();
  }, [tasks]);

  const drawChart = () => {
    const ctx = chartRef.current.getContext('2d');
    if (window.myChart) window.myChart.destroy();
    window.myChart = new Chart(ctx, {
      type: 'bar',
      data: {
        labels: tasks.map(t => t.name),
        datasets: [
          { label: '標準工時', data: tasks.map(t => t.standard), backgroundColor: '#60a5fa' },
          { label: '實績工時', data: tasks.map(t => t.actual), backgroundColor: '#f87171' }
        ]
      },
      options: { responsive: true, plugins: { legend: { position: 'top' } } }
    });
  };

  const exportExcel = () => {
    const wb = XLSX.utils.book_new();
    const ws_data = [['工序','人員','標準','實績','階段','線別']];
    tasks.forEach(t => ws_data.push([t.name, t.person, t.standard, t.actual, t.stage, t.lane]));
    const ws = XLSX.utils.aoa_to_sheet(ws_data);
    XLSX.utils.book_append_sheet(wb, ws, '山積圖');
    XLSX.writeFile(wb, '山積圖.xlsx');
  };

  const addTask = () => {
    const newTask = { id: Date.now(), name: '新工序', person: '', standard: 0, actual: 0, stage: '前段', lane: 1 };
    setTasks([...tasks, newTask]);
  };

  const updateTask = (id, key, value) => {
    setTasks(tasks.map(t => t.id === id ? { ...t, [key]: value } : t));
  };

  const removeTask = id => setTasks(tasks.filter(t => t.id !== id));

  return (
    <div className="p-4">
      <h1 className="text-2xl font-bold mb-4 text-center">智慧山積圖 PWA</h1>
      <div className="chart-container mb-4">
        <canvas ref={chartRef}></canvas>
      </div>
      <table className="analysis-table mb-4">
        <thead>
          <tr>
            <th>工序</th><th>人員</th><th>標準</th><th>實績</th><th>階段</th><th>線別</th><th>操作</th>
          </tr>
        </thead>
        <tbody>
          {tasks.map(t => (
            <tr key={t.id}>
              <td><input value={t.name} onChange={e=>updateTask(t.id,'name',e.target.value)} /></td>
              <td><input value={t.person} onChange={e=>updateTask(t.id,'person',e.target.value)} /></td>
              <td><input type="number" value={t.standard} onChange={e=>updateTask(t.id,'standard',Number(e.target.value))} /></td>
              <td><input type="number" value={t.actual} onChange={e=>updateTask(t.id,'actual',Number(e.target.value))} /></td>
              <td><select value={t.stage} onChange={e=>updateTask(t.id,'stage',e.target.value)}>
                <option value="前段">前段</option><option value="後段">後段</option>
              </select></td>
              <td><input type="number" value={t.lane} onChange={e=>updateTask(t.id,'lane',Number(e.target.value))} /></td>
              <td><button onClick={()=>removeTask(t.id)} className="text-red-500">刪除</button></td>
            </tr>
          ))}
        </tbody>
      </table>
      <div className="flex gap-2">
        <button onClick={addTask} className="bg-blue-500 text-white px-3 py-1 rounded">新增工序</button>
        <button onClick={exportExcel} className="bg-green-500 text-white px-3 py-1 rounded">匯出 Excel</button>
      </div>
    </div>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>

<script>
// --- 內建 Service Worker ---
if ('serviceWorker' in navigator) {
  const swCode = `
  const CACHE_NAME = 'factory-app-v1';
  const urlsToCache = [
    '/',
    location.pathname,
    location.pathname + 'index.html',
    'https://cdn.jsdelivr.net/npm/chart.js',
    'https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js'
  ];
  self.addEventListener('install', e => {
    e.waitUntil(caches.open(CACHE_NAME).then(c => c.addAll(urlsToCache)));
  });
  self.addEventListener('fetch', e => {
    e.respondWith(caches.match(e.request).then(r => r || fetch(e.request)));
  });
  self.addEventListener('activate', e => {
    e.waitUntil(caches.keys().then(keys => Promise.all(keys.filter(k=>k!==CACHE_NAME).map(k=>caches.delete(k)))));
  });
  `;
  const blob = new Blob([swCode], { type: 'application/javascript' });
  const swURL = URL.createObjectURL(blob);
  navigator.serviceWorker.register(swURL).catch(console.error);
}
</script>
</body>
</html>
