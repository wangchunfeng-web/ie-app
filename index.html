<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>智慧裝配山積圖系統</title>

<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/2921/2921226.png">
<link rel="manifest" id="manifest-placeholder">

<script src="https://cdn.tailwindcss.com"></script>
<script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body { -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
.chart-container { position: relative; width: 100%; height: 250px; max-height: 400px; margin-bottom: 16px; }
.lane-scroll::-webkit-scrollbar { width: 4px; height: 4px; }
.lane-scroll::-webkit-scrollbar-track { background: #f1f5f9; }
.lane-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
.analysis-table { border-collapse: collapse; width: 100%; font-size: 13px; text-align: center; }
.analysis-table th, .analysis-table td { border: 1px solid #000; padding: 4px; }
.analysis-table th { background-color: #f3f4f6; font-weight: bold; }
.bg-orange-light { background-color: #ffedd5; }
.modal-overlay { position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:9999; display:flex; justify-content:center; align-items:center; padding:20px; }
input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
input[type=number] { -moz-appearance: textfield; }
</style>
</head>
<body class="bg-slate-100 text-slate-800 pb-20 select-none">
<div id="root"></div>

<script>
const manifest = {
  "name": "智慧山積圖",
  "short_name": "山積圖",
  "start_url": ".",
  "display": "standalone",
  "background_color": "#f1f5f9",
  "theme_color": "#0f172a",
  "icons":[{"src":"https://cdn-icons-png.flaticon.com/512/2921/2921226.png","sizes":"512x512","type":"image/png"}]
};
const blob = new Blob([JSON.stringify(manifest)], {type: 'application/json'});
document.querySelector('#manifest-placeholder').setAttribute('href', URL.createObjectURL(blob));
</script>

<script type="text/babel">
const { useState, useEffect, useRef } = React;

// --- Icons 範例 ---
const IconBase = ({children, size=16, className=""})=>(
<svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>{children}</svg>
);
const Icons = {
  Plus: (p)=><IconBase {...p}><path d="M5 12h14"/><path d="M12 5v14"/></IconBase>,
  Trash2: (p)=><IconBase {...p}><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></IconBase>
};

// --- Modal ---
function Modal({show, onClose, children}){
  if(!show) return null;
  return (
    <div className="modal-overlay" onClick={onClose}>
      <div className="bg-white rounded-lg shadow p-4 max-w-lg w-full" onClick={e=>e.stopPropagation()}>
        {children}
        <button className="mt-2 px-4 py-2 bg-red-500 text-white rounded" onClick={onClose}>關閉</button>
      </div>
    </div>
  );
}

// --- Chart 組件 ---
function LineChart({labels, data, label}) {
  const chartRef = useRef(null);
  const chartInstance = useRef(null);

  useEffect(()=>{
    const ctx = chartRef.current.getContext('2d');
    if(chartInstance.current) chartInstance.current.destroy();
    chartInstance.current = new Chart(ctx, {
      type:'line',
      data:{ labels, datasets:[{label, data, borderColor:"#3b82f6", backgroundColor:"rgba(59,130,246,0.2)", fill:true}] },
      options:{ responsive:true, maintainAspectRatio:false }
    });
  }, [labels, data, label]);

  return <canvas ref={chartRef} className="chart-container bg-white rounded-lg shadow p-2"></canvas>;
}

function BarChart({labels, data, label}) {
  const chartRef = useRef(null);
  const chartInstance = useRef(null);

  useEffect(()=>{
    const ctx = chartRef.current.getContext('2d');
    if(chartInstance.current) chartInstance.current.destroy();
    chartInstance.current = new Chart(ctx, {
      type:'bar',
      data:{ labels, datasets:[{label, data, backgroundColor:"rgba(59,130,246,0.7)"}] },
      options:{ responsive:true, maintainAspectRatio:false }
    });
  }, [labels, data, label]);

  return <canvas ref={chartRef} className="chart-container bg-white rounded-lg shadow p-2"></canvas>;
}

// --- App ---
function App(){
  const [lineData, setLineData] = useState([5,3,4,7,2]);
  const [barData, setBarData] = useState([2,6,3,5,8]);
  const [showModal, setShowModal] = useState(false);

  const labels = ["一","二","三","四","五"];

  const increaseAll = ()=>{
    setLineData(lineData.map(d=>d+1));
    setBarData(barData.map(d=>d+1));
  };
  const resetData = ()=>{
    setLineData([5,3,4,7,2]);
    setBarData([2,6,3,5,8]);
  };

  return (
    <div className="p-4">
      <h1 className="text-2xl font-bold mb-4">智慧裝配山積圖系統</h1>

      <LineChart labels={labels} data={lineData} label="折線圖"/>
      <BarChart labels={labels} data={barData} label="柱狀圖"/>

      <div className="mt-4 flex flex-wrap gap-2">
        <button className="px-4 py-2 bg-blue-500 text-white rounded flex items-center gap-1" onClick={increaseAll}><Icons.Plus/>增加數值</button>
        <button className="px-4 py-2 bg-green-500 text-white rounded" onClick={resetData}>重置數值</button>
        <button className="px-4 py-2 bg-orange-500 text-white rounded" onClick={()=>setShowModal(true)}>分析表</button>
      </div>

      <Modal show={showModal} onClose={()=>setShowModal(false)}>
        <h2 className="text-lg font-bold mb-2">分析數據表</h2>
        <table className="analysis-table w-full">
          <thead>
            <tr><th>項目</th><th>折線圖數值</th><th>柱狀圖數值</th></tr>
          </thead>
          <tbody>
            {labels.map((l,i)=>
              <tr key={i}>
                <td>{l}</td>
                <td>{lineData[i]}</td>
                <td>{barData[i]}</td>
              </tr>
            )}
          </tbody>
        </table>
      </Modal>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>

<!-- 內嵌 Service Worker -->
<script>
if('serviceWorker' in navigator){
  const swCode = `
    const CACHE_NAME = 'pwa-cache-v1';
    const urlsToCache = ['./','${location.href}'];
    self.addEventListener('install', event => {
      event.waitUntil(
        caches.open(CACHE_NAME).then(cache => cache.addAll(urlsToCache))
      );
    });
    self.addEventListener('fetch', event => {
      event.respondWith(
        caches.match(event.request).then(response => response || fetch(event.request))
      );
    });
  `;
  const blob = new Blob([swCode], {type: 'application/javascript'});
  const swURL = URL.createObjectURL(blob);
  navigator.serviceWorker.register(swURL).then(reg=>console.log('SW 註冊成功', reg.scope))
    .catch(err=>console.log('SW 註冊失敗', err));
}
</script>
</body>
</html>
